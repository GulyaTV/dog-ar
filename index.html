<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Dog AR 1.0</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Видео с камеры (будет фон для AR) -->
  <video id="camera" autoplay playsinline muted></video>
  
  <!-- 3D‑канвас (пока пустой, можно добавить Three.js/WebXR‑сцену) -->
  <canvas id="three-canvas"></canvas>

  <!-- UI MixDog 1.0: кнопки‑приложения -->
  <div id="ui">
    <button class="mixdog-btn" id="app1">App 1</button>
    <button class="mixdog-btn" id="app2">App 2</button>
    <button class="mixdog-btn" id="app3">App 3</button>
  </div>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <!-- наш скрипт -->
  <script src="script.js"></script>
</body>
</html>
