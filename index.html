<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Dog MR 1.0</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- фон — видео с камеры -->
  <video id="camera" autoplay playsinline muted></video>
  
  <!-- Three.js‑канвас -->
  <canvas id="three-canvas"></canvas>

  <!-- Зона для «плоского» HUD (CSS‑3D через Three.js CSS3DRenderer можно добавить позже) -->
  <div id="hud"></div>

  <!-- скрипты: Three.js, VRButton, ваши модули -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/jsm/webxr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script type="module" src="scripts/main.js"></script>
</body>
</html>
